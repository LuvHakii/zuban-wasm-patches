name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: pin
        id: pin
        run: |
          SHA=$(git rev-parse HEAD:zuban)
          TAG=$(git ls-remote --tags https://github.com/zubanls/zuban.git | grep "^$SHA" | cut -f2 | sed 's|refs/tags/||; s|\^{}$||' | tail -1 || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "rev=${TAG:-$SHA}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm target
        run: rustup target add wasm32-wasip1

      - name: Install wasm-opt
        env:
          BINARYEN_VER: "133"
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VER}/binaryen-version_${BINARYEN_VER}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp/binaryen-version_${BINARYEN_VER}/bin" >> "$GITHUB_PATH"

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            zuban/target
            !zuban/target/wasm
            !zuban/target/wasm32-wasip1/release/zubanls.wasm
            ~/.cargo/registry
            ~/.cargo/git
          key: zuban-${{ steps.pin.outputs.sha }}-${{ hashFiles('patches/*', 'overlay/**', 'scripts/apply-rules.sh') }}

      - name: build
        run: bash scripts/build.sh

      - name: smoke
        run: |
          git -C zuban submodule update --init --depth 1 third_party/typeshed
          node scripts/smoke.ts zuban/target/wasm/zuban.wasm zuban/third_party/typeshed

      - name: stage release
        run: |
          mkdir -p release
          cp zuban/target/wasm/* release/
          PATCHES=$(basename -a patches/* | jq -R . | jq -s .)
          printf '{"zubanRev":"%s","zubanBaseCommit":"%s","patches":%s}' \
            "${{ steps.pin.outputs.rev }}" "${{ steps.pin.outputs.sha }}" "$PATCHES" > release/versions.json
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: zuban-wasm-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'Zuban: %s (%s)\nPatch: zubanls server on wasm32-wasip1, newline-delimited JSON stdio\n%s\n' \
            "${{ steps.pin.outputs.rev }}" "${{ steps.pin.outputs.sha }}" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber
