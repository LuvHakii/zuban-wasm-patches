name: build

on:
  workflow_dispatch:
    inputs:
      zuban_rev:
        description: "zubanls/zuban tag/branch/commit to build against"
        type: string
        default: master
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROOT: /home/runner/zuban-build
  ZUBAN_REV: ${{ inputs.zuban_rev }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm target
        run: rustup target add wasm32-wasip1

      - name: Install wasm-opt
        env:
          BINARYEN_VER: "133"
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VER}/binaryen-version_${BINARYEN_VER}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp/binaryen-version_${BINARYEN_VER}/bin" >> "$GITHUB_PATH"

      - name: cache source + cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ROOT }}/zuban
            !${{ env.ROOT }}/zuban/target/wasm
            !${{ env.ROOT }}/zuban/target/wasm32-wasip1/release/zuban.wasm
            ~/.cargo/registry
            ~/.cargo/git
          key: zuban-${{ inputs.zuban_rev }}-${{ hashFiles('scripts/setup.sh', 'patches/*.patch') }}

      - name: setup
        run: bash scripts/setup.sh

      - name: build
        run: bash scripts/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: smoke
        run: |
          source scripts/common.sh
          git -C $SRC submodule update --init --depth 1 third_party/typeshed
          node scripts/smoke.ts $SRC/target/wasm/zuban.wasm $SRC/third_party/typeshed

      - name: stage release
        run: |
          source scripts/common.sh
          mkdir -p release
          cp $ROOT/zuban/target/wasm/* release/
          ZUBAN_COMMIT=$(git -C $ROOT/zuban rev-parse HEAD)
          PATCHES=$(basename -a $REPO/patches/*.patch | jq -R . | jq -s .)
          printf '{"zubanRev":"%s","zubanBaseCommit":"%s","patches":%s}' \
            "$ZUBAN_REV" "$ZUBAN_COMMIT" "$PATCHES" > release/versions.json
          echo "zuban_commit=$ZUBAN_COMMIT" >> "$GITHUB_OUTPUT"
          ls -la release/
        id: v

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: zuban-wasm-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'Zuban: %s (%s)\nPatch: zubanls server on wasm32-wasip1, newline-delimited JSON stdio\n%s\n' \
            "$ZUBAN_REV" "${{ steps.v.outputs.zuban_commit }}" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber
