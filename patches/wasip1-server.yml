id: watched-files-handler
language: rust
files: [crates/zubanls/src/server.rs]
metadata: { expect: 1 }
rule: { kind: function_item, pattern: $F, has: { field: name, regex: ^on_notify_events$ } }
fix: |-
  fn handle_did_change_watched_files(
      &mut self,
      params: lsp_types::DidChangeWatchedFilesParams,
  ) -> anyhow::Result<()> {
      let mut event = notify::Event::new(EventKind::Modify(notify::event::ModifyKind::Any));
      for change in params.changes {
          event = event.add_path(patch_path_prefix(&change.uri)?.into());
      }
      self.on_notify_event(Ok(event));
      Ok(())
  }

  $F
