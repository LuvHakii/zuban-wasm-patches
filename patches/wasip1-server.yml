id: run-server-stdio-pump
language: rust
files: [crates/zubanls/src/server.rs]
metadata: { expect: 1 }
rule:
  kind: function_item
  pattern: $F
  has: { field: name, regex: ^run_server$ }
rewriters:
- id: memory-conn
  rule: { pattern: 'let (connection, _io_threads) = Connection::stdio();' }
  fix: |-
    let (connection, client) = Connection::memory();
    STDIO.set(Some(client));
    pump()?;
- id: flush-cleanup
  rule: { pattern: 'run_server_with_custom_connection(cli_options, connection, None, $CLEANUP)' }
  fix: run_server_with_custom_connection(cli_options, connection, None, flush)
transform:
  NEW: { rewrite: { source: $F, rewriters: [memory-conn, flush-cleanup] } }
fix: |-
  $NEW

  thread_local!(static STDIO: RefCell<Option<Connection>> = const { RefCell::new(None) });

  fn flush() -> anyhow::Result<()> {
      use std::io::Write as _;
      STDIO.with_borrow(|client| {
          let mut out = std::io::stdout().lock();
          for msg in client.iter().flat_map(|c| c.receiver.try_iter()) {
              serde_json::to_writer(&mut out, &msg)?;
              out.write_all(b"\n")?;
          }
          Ok(out.flush()?)
      })
  }

  fn pump() -> anyhow::Result<()> {
      flush()?;
      STDIO.with_borrow(|client| {
          let Some(client) = client else { return Ok(()) };
          let mut line = String::new();
          let msg = match std::io::stdin().read_line(&mut line)? {
              0 => Message::Notification(lsp_server::Notification::new("exit".into(), ())),
              _ => serde_json::from_str(&line)?,
          };
          Ok(client.sender.send(msg)?)
      })
  }
---
